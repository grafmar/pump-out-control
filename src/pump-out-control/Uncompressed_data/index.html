<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Pump-out Control</title>
	<link rel="icon" type="image/png" sizes="144x144" href="favicon-144x144.png">
	<link rel="icon" type="image/png" sizes="96x96" href="favicon.ico">
	<link rel="manifest" href="manifest.json">
	<link rel="stylesheet" href="styles.css">
	<script src="chart_packed.js"></script>
</head>

<body>
	<h1>Pump-out Control</h1>

	<div class="controls">
		<label><input type="checkbox" data-id="waterLevel" checked> Water level (cm)</label>
		<label><input type="checkbox" data-id="pumpRuntime" checked> Pump runtime (s)</label>
	</div>

	<div class="hint">
		Ctrl + 🖱️ Mouse wheel = Zoom &nbsp;|&nbsp;
		⇧ Shift + Drag = Zoom (Selection) &nbsp;|&nbsp;
		Ctrl + Drag = Pan &nbsp;|&nbsp;
		Double-click = Reset
	</div>

	<div class="controls">
		<a href="data.csv" download class="button">⬇ Download data.csv</a>
		<a href="config.html" class="button">Configure Logger</a>
	</div>

	<div class="chart-container">
		<h3>Water level and pump runtime</h3>
		<canvas id="pumpOutChart"></canvas>
	</div>

	<div class="controls">
		<label><input type="checkbox" data-chart="waterVolumeChart" data-id="accumulatedWater" checked> Accumulated water (L)</label>
		<label><input type="checkbox" data-chart="waterVolumeChart" data-id="averageWaterPerDay" checked> Average water per day (L/day)</label>
	</div>

	<div class="chart-container">
		<h3>Water volume</h3>
		<canvas id="waterVolumeChart"></canvas>
	</div>

	<script>
		let initialMinX = null;
		let initialMaxX = null;
		const BUCKET_DIAMETER_CM = 26;
		const LITERS_PER_CM = Math.PI * (BUCKET_DIAMETER_CM / 2) ** 2 / 1000;

		Chart.register(ChartZoom);

		function drawMessage(message) {
			const canvas = document.getElementById("pumpOutChart");
			const ctx = canvas.getContext("2d");
			ctx.clearRect(0, 0, canvas.width, canvas.height);
			ctx.font = "20px Arial";
			ctx.fillText(message, 10, 40);
		}

		async function loadCSV(url) {
			drawMessage("Data loading ...");

			const response = await fetch(url);
			if (!response.ok) throw new Error("Could not load " + url + ": " + response.status);
			const text = await response.text();
			const data = { time: [], waterLevel: [], pumpRuntime: [] };

			for (const row of text.split(/\r?\n/)) {
				if (!row) continue;
				const columns = row.split(";");
				if (columns.length !== 3) continue;

				const timestamp = Number(columns[0]);
				const waterLevel = columns[1] === "" ? NaN : Number(columns[1]);
				const runtime = columns[2] === "" ? NaN : Number(columns[2]);
				if (!Number.isFinite(timestamp)) continue;

				data.time.push(new Date(timestamp * 1000));
				data.waterLevel.push(Number.isFinite(waterLevel) ? waterLevel : NaN);
				data.pumpRuntime.push(Number.isFinite(runtime) ? runtime : NaN);
			}

			return data;
		}

		function calculatePumpMetrics(data) {
			const accumulatedWater = [];
			const averageWaterPerDay = [];
			let cumulativeLiters = 0;
			let previousPumpEventTime = null;
			let sampleIndex = 0;
			let waterLevelBeforePump = NaN;

			for (let i = 0; i < data.time.length; i++) {
				accumulatedWater.push(cumulativeLiters);
				averageWaterPerDay.push(NaN);

				if (!Number.isFinite(data.pumpRuntime[i]) || data.pumpRuntime[i] <= 0) continue;

				const eventTime = data.time[i].getTime();
				const pumpStartTime = eventTime - data.pumpRuntime[i] * 1000;
				while (sampleIndex < i && data.time[sampleIndex].getTime() <= pumpStartTime) {
					if (Number.isFinite(data.waterLevel[sampleIndex])) {
						waterLevelBeforePump = data.waterLevel[sampleIndex];
					}
					sampleIndex++;
				}

				const waterLevelAfterPump = data.waterLevel[i];
				const eventVolume = Number.isFinite(waterLevelBeforePump) && Number.isFinite(waterLevelAfterPump)
					? Math.max(0, waterLevelBeforePump - waterLevelAfterPump) * LITERS_PER_CM
					: NaN;

				if (Number.isFinite(eventVolume)) {
					cumulativeLiters += eventVolume;
					accumulatedWater[i] = cumulativeLiters;
					if (previousPumpEventTime !== null) {
						const elapsedDays = (eventTime - previousPumpEventTime) / 86400000;
						if (elapsedDays > 0) averageWaterPerDay[i] = eventVolume / elapsedDays;
					}
				}

				previousPumpEventTime = eventTime;
			}

			return { accumulatedWater, averageWaterPerDay };
		}

		function baseOptions(leftAxisId, leftAxisTitle, rightAxisId, rightAxisTitle) {
			return {
				responsive: true,
				interaction: { mode: "index", intersect: false },
				plugins: {
					zoom: {
						pan: { enabled: true, mode: "x", modifierKey: "ctrl" },
						zoom: {
							wheel: { enabled: true, modifierKey: "ctrl" },
							pinch: { enabled: true },
							mode: "x",
							drag: { enabled: true, modifierKey: "shift" }
						}
					}
				},
				scales: {
					x: {
						type: "time",
						time: {
							tooltipFormat: "dd.MM.yyyy HH:mm",
							displayFormats: {
								second: "dd.MM.yyyy\nHH:mm:ss",
								minute: "dd.MM.yyyy\nHH:mm",
								hour: "dd.MM.yyyy\nHH:mm",
								day: "dd.MM.yyyy",
								month: "dd.MM.yyyy"
							}
						},
						ticks: {
							source: "auto",
							maxTicksLimit: 10,
							autoSkip: true,
							maxRotation: 0,
							callback: function (value) {
								const date = new Date(value);
								return [
									date.toLocaleDateString("de-CH"),
									date.toLocaleTimeString("de-CH", { hour: "2-digit", minute: "2-digit" })
								];
							}
						}
					},
					[leftAxisId]: {
						position: "left",
						title: { display: true, text: leftAxisTitle }
					},
					[rightAxisId]: {
						position: "right",
						title: { display: true, text: rightAxisTitle },
						grid: { drawOnChartArea: false }
					}
				}
			};
		}

		let pumpOutChart;
		let waterVolumeChart;

		loadCSV("data.csv").then(data => {
			if (data.time.length === 0) {
				drawMessage("No compatible water-level data available.");
				return;
			}

			initialMinX = data.time[0];
			initialMaxX = data.time[data.time.length - 1];

			pumpOutChart = new Chart(document.getElementById("pumpOutChart"), {
				type: "line",
				data: {
					labels: data.time,
					datasets: [
						{
							id: "waterLevel",
							label: "Water level (cm)",
							data: data.waterLevel,
							borderColor: "blue",
							pointRadius: 2,
							yAxisID: "level"
						},
						{
							id: "pumpRuntime",
							label: "Pump runtime (s)",
							data: data.pumpRuntime,
							borderColor: "orange",
							backgroundColor: "orange",
							showLine: false,
							pointRadius: 4,
							yAxisID: "runtime"
						}
					]
				},
				options: baseOptions("level", "cm", "runtime", "s")
			});

			const pumpMetrics = calculatePumpMetrics(data);
			waterVolumeChart = new Chart(document.getElementById("waterVolumeChart"), {
				type: "line",
				data: {
					labels: data.time,
					datasets: [
						{
							id: "accumulatedWater",
							label: "Accumulated water (L)",
							data: pumpMetrics.accumulatedWater,
							borderColor: "green",
							pointRadius: 0,
							stepped: "after",
							yAxisID: "volume"
						},
						{
							id: "averageWaterPerDay",
							label: "Average water per day (L/day)",
							data: pumpMetrics.averageWaterPerDay,
							borderColor: "purple",
							backgroundColor: "purple",
							showLine: false,
							pointRadius: 4,
							yAxisID: "dailyVolume"
						}
					]
				},
				options: baseOptions("volume", "L", "dailyVolume", "L/day")
			});

			document.querySelectorAll('.controls input[type="checkbox"]').forEach(checkbox => {
				checkbox.onchange = () => {
					const chart = checkbox.dataset.chart === "waterVolumeChart" ? waterVolumeChart : pumpOutChart;
					const dataset = chart.data.datasets.find(item => item.id === checkbox.dataset.id);
					if (dataset) {
						dataset.hidden = !checkbox.checked;
						chart.update();
					}
				};
			});
		}).catch(error => {
			console.error(error);
			drawMessage("Could not load data.csv.");
		});

		document.addEventListener("dblclick", () => {
			for (const chart of [pumpOutChart, waterVolumeChart]) {
				if (!chart) continue;
				chart.options.scales.x.min = initialMinX;
				chart.options.scales.x.max = initialMaxX;
				chart.update();
			}
		});
	</script>
</body>
</html>
